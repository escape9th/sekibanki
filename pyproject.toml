[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekibanki"
version = "0.1.0"
description = "Tiny, local-first traces and replayable timelines for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "escape9th"}]
keywords = ["ai", "agents", "observability", "tracing", "debugging", "llm"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Software Development :: Debuggers"]

[project.scripts]
sekibanki = "sekibanki.cli:main"

[tool.setuptools.packages.find]
include = ["sekibanki*"]
